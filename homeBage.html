<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الصفحة الرئيسية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-light: #f8fafc;
      --bg-gradient-light: radial-gradient(circle at 50% 20%, #ffffff 0%, #edf4f8 60%, #e2ebf0 100%);
      --text-light: #1e293b;
      --card-bg-light: rgba(255, 255, 255, 0.85);

      --bg-dark: #0f172a;
      --bg-gradient-dark: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      --text-dark: #f8fafc;
      --card-bg-dark: rgba(30, 41, 59, 0.85);

      --gold-primary: #d4af37;
      --gold-dark: #b8860b;
      --navy-primary: #1a2a40;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      direction: rtl;
      background: var(--bg-gradient-light);
      background-attachment: fixed;
      color: var(--text-light);
      transition: background 0.5s ease, color 0.5s ease, opacity 0.6s ease;
      opacity: 0;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    body.visible {
      opacity: 1;
    }

    body.dark-mode {
      background: var(--bg-gradient-dark);
      background-attachment: fixed;
      color: var(--text-dark);
    }

    /* خلفية الصلبان المتحركة */
    #crosses-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-cross {
      position: absolute;
      color: var(--gold-primary);
      opacity: 0.25;
      font-size: 20px;
      user-select: none;
      animation: fall linear infinite;
    }

    body.dark-mode .bg-cross {
      opacity: 0.35;
    }

    @keyframes fall {
      0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* الشريط العلوي */
    .top-navbar {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      height: 65px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    body.dark-mode .top-navbar {
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
    }

    .navbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .navbar-left img {
      height: 42px;
      width: 42px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
    }

    .site-title {
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--navy-primary);
      transition: color 0.4s;
    }

    body.dark-mode .site-title {
      color: var(--gold-primary);
    }

    /* زر التبديل للوضع الداكن */
    .theme-switch-wrapper {
      display: flex;
      align-items: center;
    }

    .theme-switch {
      display: inline-block;
      height: 30px;
      position: relative;
      width: 60px;
    }

    .theme-switch input {
      display: none;
    }

    .slider {
      background-color: #cbd5e1;
      bottom: 0;
      cursor: pointer;
      left: 0;
      position: absolute;
      right: 0;
      top: 0;
      transition: 0.4s;
      border-radius: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .slider:before {
      background-color: #fff;
      bottom: 3px;
      content: "";
      height: 22px;
      left: 3px;
      position: absolute;
      transition: 0.4s;
      width: 22px;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    input:checked + .slider {
      background-color: var(--navy-primary);
      border-color: var(--gold-primary);
    }

    input:checked + .slider:before {
      transform: translateX(30px);
      background-color: var(--gold-primary);
    }

    /* المحتوى الرئيسي */
    .content {
      padding: 95px 15px 30px;
      max-width: 1000px;
      margin: auto;
      position: relative;
      z-index: 1;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--navy-primary);
    }

    body.dark-mode h2 {
      color: var(--gold-primary);
    }

    .buttons-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 22px;
    }

    .button-card {
      flex: 1 1 200px;
      max-width: 240px;
      background: var(--card-bg-light);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 20px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(8px);
      transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.4s ease;
      display: flex;
      flex-direction: column;
    }

    body.dark-mode .button-card {
      background: var(--card-bg-dark);
      border-color: rgba(212, 175, 55, 0.15);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .button-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(212, 175, 55, 0.2);
    }

    .button-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 15px;
    }

    .button-card button {
      margin-top: auto;
      background: linear-gradient(135deg, var(--navy-primary) 0%, #2c3e50 100%);
      color: var(--gold-primary);
      border: 1px solid var(--gold-primary);
      border-radius: 12px;
      padding: 12px;
      width: 100%;
      font-size: 1.05rem;
      font-family: 'Tajawal', sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(26, 42, 64, 0.2);
    }

    .button-card button:hover {
      background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-dark) 100%);
      color: #ffffff;
      border-color: transparent;
      transform: scale(1.02);
    }

    /* صندوق التقويم */
    #date-box {
      background: var(--card-bg-light);
      border: 1px solid rgba(212, 175, 55, 0.25);
      margin: 30px auto 40px;
      max-width: 500px;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.8;
      box-shadow: 0 8px 20px rgba(0,0,0,0.04);
      color: var(--navy-primary);
      transition: all 0.4s ease;
    }

    body.dark-mode #date-box {
      background: var(--card-bg-dark);
      color: #e2e8f0;
      border-color: rgba(212, 175, 55, 0.2);
    }

    /* أنماط النافذة المنبثقة (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(5px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-box {
      background: #ffffff;
      width: 90%;
      max-width: 420px;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      border: 1px solid var(--gold-primary);
      transform: translateY(20px);
      transition: transform 0.3s ease;
      position: relative;
    }

    body.dark-mode .modal-box {
      background: #1e293b;
      color: var(--text-dark);
    }

    .modal-overlay.active .modal-box {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.3);
      padding-bottom: 10px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--navy-primary);
    }

    body.dark-mode .modal-title {
      color: var(--gold-primary);
    }

    .close-modal {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #94a3b8;
      cursor: pointer;
      line-height: 1;
    }

    .close-modal:hover {
      color: #e11d48;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: right;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .form-group select,
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s;
      background: #f8fafc;
    }

    body.dark-mode .form-group select,
    body.dark-mode .form-group input {
      background: #0f172a;
      border-color: #334155;
      color: #fff;
    }

    .form-group select:focus,
    .form-group input:focus {
      border-color: var(--gold-primary);
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-dark) 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: 'Tajawal', sans-serif;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
      transition: transform 0.2s, background 0.3s;
    }

    .submit-btn:hover {
      transform: scale(1.02);
    }

    @media (max-width: 600px) {
      .top-navbar { padding: 0 15px; }
      .site-title { font-size: 0.95rem; }
      .content { padding-top: 85px; }
      .button-card { max-width: 100%; flex: 1 1 100%; }
    }
  </style>
</head>
<body>

  <!-- حاوية أشكال الصلبان المتحركة -->
  <div id="crosses-container"></div>

  <div class="top-navbar">
    <div class="navbar-left">
      <img src="صوره الكنيسه.jpeg" alt="شعار الكنيسة" />
      <span class="site-title">كنيسة مارمينا والأنبا توماس و البابا كيرلس السادس</span>
    </div>
    
    <div class="theme-switch-wrapper">
      <label class="theme-switch" for="darkModeToggle">
        <input type="checkbox" id="darkModeToggle" />
        <div class="slider">
          <span class="icon">☀️</span>
          <span class="icon">🌙</span>
        </div>
      </label>
    </div>
  </div>

  <div class="content">
    <h2>القائمة الرئيسية</h2>
    <div class="buttons-list">
      
      <div class="button-card">
        <img src="kholagyImage.webp" alt="القداس">
        <button onclick="location.href='kholagy.html'">الخولاجي</button>
      </div>

      <div class="button-card">
        <img src="duf.webp" alt="المردات والالحان">
        <button onclick="location.href='alhan.html'">المردات والألحان</button>
      </div>

      <div class="button-card">
        <img src="pngtree-cartoon-jesus-is-sitting-under-a-tree-with-kids-png-image_12604233.png" alt="العاب">
        <button onclick="location.href='play.html'">ألعاب</button>
      </div>

      <div class="button-card">
        <img src="صوره الكنيسه.jpeg" alt="حجز مواعيد الاعترافات">
        <button onclick="openConfessionModal()">حجز مواعيد الاعترافات</button>
      </div>

    </div>

    <div id="date-box">📅 جاري تحميل التاريخ...</div>
  </div>

  <!-- النافذة المنبثقة (Modal) لحجز موعد الاعتراف -->
  <div class="modal-overlay" id="confessionModal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">📌 حجز موعد اعتراف</span>
        <button class="close-modal" onclick="closeConfessionModal()">&times;</button>
      </div>
      
      <form id="confessionForm" onsubmit="handleFormSubmit(event)">
        <div class="form-group">
          <label for="fullName">الاسم الثلاثي:</label>
          <input type="text" id="fullName" placeholder="أدخل اسمك الثلاثي" required />
        </div>

        <div class="form-group">
          <label for="phoneNumber">رقم التليفون:</label>
          <input type="tel" id="phoneNumber" placeholder="01XXXXXXXXX" pattern="[0-9]{11}" required />
        </div>

        <div class="form-group">
          <label for="weekDay">اختر يوم الأسبوع:</label>
          <select id="weekDay" required>
            <option value="">اختر اليوم المناسب...</option>
            <option value="السبت">السبت</option>
            <option value="الأحد">الأحد</option>
            <option value="الإثنين">الإثنين</option>
            <option value="الثلاثاء">الثلاثاء</option>
            <option value="الاربعاء">الاربعاء</option>
            <option value="الخميس">الخميس</option>
            <option value="الجمعة">الجمعة</option>
          </select>
        </div>

        <button type="submit" class="submit-btn">تأكيد الحجز</button>
      </form>
    </div>
  </div>

  <script>
    const root = document.body;
    const darkModeToggle = document.getElementById("darkModeToggle");
    const confessionModal = document.getElementById("confessionModal");

    // تطبيق حالة الوضع الداكن المجلوبة من LocalStorage
    function applySavedTheme() {
      const savedMode = localStorage.getItem("darkMode");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

      if (savedMode === "on" || (!savedMode && prefersDark)) {
        root.classList.add("dark-mode");
        darkModeToggle.checked = true;
      } else {
        root.classList.remove("dark-mode");
        darkModeToggle.checked = false;
      }
    }

    // فتح وإغلاق النافذة المنبثقة
    function openConfessionModal() {
      confessionModal.classList.add("active");
    }

    function closeConfessionModal() {
      confessionModal.classList.remove("active");
    }

    // إغلاق النافذة عند النقر خارجها
    confessionModal.addEventListener("click", (e) => {
      if (e.target === confessionModal) {
        closeConfessionModal();
      }
    });

    // التعامل مع تأكيد الحجز وحفظه في LocalStorage
    function handleFormSubmit(event) {
      event.preventDefault();
      const fullName = document.getElementById("fullName").value.trim();
      const phone = document.getElementById("phoneNumber").value.trim();
      const weekDay = document.getElementById("weekDay").value;

      const newBooking = {
        id: Date.now(),
        name: fullName,
        phone: phone,
        dayName: weekDay,
        createdAt: new Date().toLocaleString('ar-EG')
      };

      const existingBookings = JSON.parse(localStorage.getItem('confession_bookings') || '[]');
      existingBookings.push(newBooking);
      localStorage.setItem('confession_bookings', JSON.stringify(existingBookings));

      alert(`✅ تم تسجيل الحجز بنجاح!\n\nالاسم: ${fullName}\nالتليفون: ${phone}\nاليوم: ${weekDay}`);
      closeConfessionModal();
      document.getElementById("confessionForm").reset();
    }

    // إنشاء الصلبان المتحركة في الخلفية
    function createFloatingCrosses() {
      const container = document.getElementById('crosses-container');
      const count = 18;
      
      for (let i = 0; i < count; i++) {
        const cross = document.createElement('div');
        cross.className = 'bg-cross';
        cross.innerText = '✟';
        
        const size = Math.random() * 18 + 14;
        const left = Math.random() * 100;
        const duration = Math.random() * 10 + 8;
        const delay = Math.random() * 10;
        
        cross.style.fontSize = `${size}px`;
        cross.style.left = `${left}%`;
        cross.style.animationDuration = `${duration}s`;
        cross.style.animationDelay = `${delay}s`;
        
        container.appendChild(cross);
      }
    }

    // زر التبديل للوضع الداكن
    darkModeToggle.addEventListener("change", () => {
      if (darkModeToggle.checked) {
        root.classList.add("dark-mode");
        localStorage.setItem("darkMode", "on");
      } else {
        root.classList.remove("dark-mode");
        localStorage.setItem("darkMode", "off");
      }
    });

    // الاستماع للتغيرات الحاصلة في التخزين من صفحات أخرى (لتحديث الوضع فورياً)
    window.addEventListener("storage", (e) => {
      if (e.key === "darkMode") {
        applySavedTheme();
      }
    });

    // حساب التاريخ القبطي
    function getCopticDate(gDate) {
      const copticMonths = [
        "توت", "بابه", "هاتور", "كيهك", "طوبه", "أمشير",
        "برمهات", "برموده", "بشنس", "بؤونه", "أبيب", "مسري", "نسيء"
      ];
      const gYear = gDate.getFullYear();
      let newYearDay = (gYear % 4 === 3) ? 12 : 11;
      let copticNewYear = new Date(gYear, 8, newYearDay);
      if (gDate < copticNewYear) {
        const prevYear = gYear - 1;
        newYearDay = (prevYear % 4 === 3) ? 12 : 11;
        copticNewYear = new Date(prevYear, 8, newYearDay);
      }
      const diffDays = Math.floor((gDate - copticNewYear) / (1000 * 60 * 60 * 24));
      const month = Math.floor(diffDays / 30);
      const day = (diffDays % 30) + 1;
      const copticYear = copticNewYear.getFullYear() - 283;
      return { day, month: copticMonths[month], year: copticYear };
    }

    function displayDates() {
      const today = new Date();
      const days = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
      const dayName = days[today.getDay()];
      const gDay = today.getDate();
      const gMonth = today.toLocaleString('ar-EG', { month: 'long' });
      const gYear = today.getFullYear();
      const gregorian = `${gDay} ${gMonth} ${gYear}`;
      const coptic = getCopticDate(today);
      const copticDate = `${coptic.day} ${coptic.month} ${coptic.year} ش`;
      
      document.getElementById("date-box").innerHTML = `
        📅 التقويم اليومي<br>
        <span style="color: var(--gold-dark);">اليوم:</span> ${dayName}<br>
        <span style="color: var(--gold-dark);">التاريخ الميلادي:</span> ${gregorian}<br>
        <span style="color: var(--gold-dark);">التاريخ القبطي:</span> ${copticDate}
      `;
    }

    document.addEventListener("DOMContentLoaded", () => {
      createFloatingCrosses();
      applySavedTheme();

      root.classList.add("visible");
      displayDates();

      if (!sessionStorage.getItem("welcomeShown")) {
        alert("👋 مرحبًا بك في تطبيق كنيسة مارمينا والأنبا توماس!");
        sessionStorage.setItem("welcomeShown", "yes");
      }
    });
  </script>
</body>
</html>
