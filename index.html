<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول وإنشاء حساب</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Tajawal', sans-serif;
      background-color: #f4f6f8;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      user-select: none;
    }
    .auth-container {
      position: relative; width: 100%; min-height: 100vh;
      background: radial-gradient(circle at 50% 30%, #ffffff 0%, #edf4f8 60%, #e2ebf0 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 30px 20px; z-index: 1; overflow: hidden;
    }
    .bg-pattern {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(rgba(180, 150, 90, 0.08) 1px, transparent 0);
      background-size: 16px 16px; pointer-events: none; z-index: 1;
    }
    .stars-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
    .auth-card {
      position: relative; z-index: 3; width: 100%; max-width: 400px;
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
      border-radius: 24px; padding: 30px 24px;
      box-shadow: 0 15px 35px rgba(23, 42, 84, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.3); text-align: center;
    }
    .cross-container {
      width: 70px; height: 70px; margin: 0 auto 15px;
      filter: drop-shadow(0px 6px 12px rgba(23, 42, 84, 0.15));
      animation: float 4s infinite ease-in-out;
    }
    .app-title {
      font-size: 20px; font-weight: 800;
      background: linear-gradient(135deg, #b8860b 0%, #d4af37 50%, #996515 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 20px; line-height: 1.3;
    }
    .tab-buttons {
      display: flex; background: #edf4f8; border-radius: 12px; padding: 4px;
      margin-bottom: 25px; border: 1px solid rgba(212, 175, 55, 0.2);
    }
    .tab-btn {
      flex: 1; padding: 10px; border: none; background: none;
      font-family: 'Tajawal', sans-serif; font-size: 14px; font-weight: 700;
      color: #5a6b7c; cursor: pointer; border-radius: 9px; transition: all 0.3s ease;
    }
    .tab-btn.active {
      background: linear-gradient(135deg, #1a2a40 0%, #2c3e50 100%);
      color: #d4af37; box-shadow: 0 4px 10px rgba(26, 42, 64, 0.2);
    }
    .auth-form { display: none; flex-direction: column; gap: 16px; text-align: right; }
    .auth-form.active { display: flex; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 13px; font-weight: 700; color: #1a2a40; }
    .form-group input {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      border: 1px solid #cbd5e1; background: #f8fafc; font-family: 'Tajawal', sans-serif;
      font-size: 14px; outline: none; transition: all 0.3s ease;
    }
    .form-group input:focus { border-color: #d4af37; background: #fff; box-shadow: 0 0 8px rgba(212, 175, 55, 0.25); }
    .submit-btn {
      margin-top: 10px; background: linear-gradient(135deg, #b8860b 0%, #d4af37 50%, #996515 100%);
      color: #ffffff; border: none; border-radius: 12px; padding: 13px;
      font-family: 'Tajawal', sans-serif; font-size: 15px; font-weight: 800; cursor: pointer;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3); transition: transform 0.2s;
    }
    .submit-btn:hover { transform: translateY(-2px); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .copyright { font-size: 11px; color: #8c9ba5; margin-top: 25px; text-align: center; position: relative; z-index: 3; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="bg-pattern"></div>
    <canvas id="starsCanvas" class="stars-canvas"></canvas>

    <div class="auth-card">
      <div class="cross-container">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <defs>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fef1a7" />
              <stop offset="50%" stop-color="#d4af37" />
              <stop offset="100%" stop-color="#996515" />
            </linearGradient>
            <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#2a4365" />
              <stop offset="100%" stop-color="#111d2e" />
            </linearGradient>
          </defs>
          <path d="M 44 8 L 56 8 L 56 36 L 84 36 L 84 48 L 56 48 L 56 84 L 44 84 L 44 48 L 16 48 L 16 36 L 44 36 Z" fill="url(#goldGrad)" stroke="#7a520c" stroke-width="1.5" />
          <path d="M 46 11 L 54 11 L 54 38 L 81 38 L 81 46 L 54 46 L 54 81 L 46 81 L 46 46 L 19 46 L 19 38 L 46 38 Z" fill="url(#blueGrad)" />
          <circle cx="50" cy="42" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" />
          <circle cx="50" cy="42" r="18" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,2" />
        </svg>
      </div>

      <h1 class="app-title">كنيسة مارمينا والأنبا توماس والبابا كيرلس السادس</h1>

      <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab('login')">تسجيل الدخول</button>
        <button class="tab-btn" onclick="switchTab('register')">حساب جديد</button>
      </div>

      <!-- تسجيل الدخول -->
      <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginName">الاسم الثلاثي:</label>
          <input type="text" id="loginName" placeholder="أدخل اسمك الثلاثي" required />
        </div>
        <div class="form-group">
          <label for="loginPassword">كلمة السر:</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required />
        </div>
        <button type="submit" class="submit-btn" id="loginBtn">دخول</button>
      </form>

      <!-- حساب جديد -->
      <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="regName">الاسم الثلاثي:</label>
          <input type="text" id="regName" placeholder="أدخل اسمك الثلاثي" required />
        </div>
        <div class="form-group">
          <label for="regPassword">كلمة السر:</label>
          <input type="password" id="regPassword" placeholder="••••••••" minlength="6" required />
        </div>
        <button type="submit" class="submit-btn" id="regBtn">إنشاء حساب</button>
      </form>
    </div>

    <p class="copyright">حقوق النشر © 2026. الكنيسة مارمينا والأنبا توماس ببولاق الدكرور.</p>
  </div>

  <script>
    const BIN_ID = "6a7b78baf5f4af5e2908c729";
    const MASTER_KEY = "$2a$10$nWS.HLOE22OzpBPoDWRac.wbPEgsvSZaQuZo/hxSNNRrbAB/HsAEu";
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    function switchTab(tab) {
      document.getElementById('loginForm').classList.toggle('active', tab === 'login');
      document.getElementById('registerForm').classList.toggle('active', tab === 'register');
      const tabs = document.querySelectorAll('.tab-btn');
      tabs[0].classList.toggle('active', tab === 'login');
      tabs[1].classList.toggle('active', tab === 'register');
    }

    async function fetchUsersFromCloud() {
      const res = await fetch(API_URL + '/latest', {
        headers: { 'X-Master-Key': MASTER_KEY.trim() }
      });
      if (!res.ok) throw new Error("تعذر جلب البيانات من السيرفر.");
      const data = await res.json();
      return Array.isArray(data.record) ? data.record : [];
    }

    async function saveUsersToCloud(users) {
      const res = await fetch(API_URL, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': MASTER_KEY.trim()
        },
        body: JSON.stringify(users)
      });
      if (!res.ok) throw new Error("تعذر حفظ البيانات على السيرفر.");
    }

    async function handleRegister(e) {
      e.preventDefault();
      const btn = document.getElementById('regBtn');
      btn.disabled = true;
      btn.innerText = "جارٍ الاتصال بالسيرفر...";

      const name = document.getElementById('regName').value.trim();
      const password = document.getElementById('regPassword').value;

      try {
        const users = await fetchUsersFromCloud();
        const exists = users.find(u => u.name && u.name.toLowerCase() === name.toLowerCase());

        if (exists) {
          alert("⚠️ هذا الاسم مسجل بالفعل!");
        } else {
          users.push({
            id: Date.now().toString(),
            name: name,
            password: password,
            status: 'pending'
          });

          await saveUsersToCloud(users);
          alert("⏳ تم إنشاء الحساب بنجاح! حسابك في انتظار موافقة الأدمن.");
          switchTab('login');
          document.getElementById('registerForm').reset();
        }
      } catch (err) {
        alert("❌ حدث خطأ أثناء الاتصال بالسيرفر: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "إنشاء حساب";
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.innerText = "جارٍ التحقق...";

      const name = document.getElementById('loginName').value.trim();
      const password = document.getElementById('loginPassword').value;

      try {
        const users = await fetchUsersFromCloud();
        const user = users.find(u => u.name && u.name.toLowerCase() === name.toLowerCase());

        if (!user) {
          alert("❌ الاسم الثلاثي غير مسجل!");
        } else if (user.password !== password) {
          alert("❌ كلمة السر غير صحيحة!");
        } else if (user.status === 'pending') {
          alert("⏳ حسابك ما زال قيد المراجعة من الأدمن.");
        } else if (user.status === 'approved') {
          alert("👋 أهلاً بك! تم تسجيل الدخول بنجاح.");
          localStorage.setItem('currentUser', JSON.stringify(user));
          window.location.href = "homeBage.html";
        } else {
          alert("❌ الحساب غير مفعّل.");
        }
      } catch (err) {
        alert("❌ حدث خطأ أثناء الاتصال بالسيرفر: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "دخول";
      }
    }

    // خلفية النجوم المتحركة
    const canvas = document.getElementById('starsCanvas');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resize(); window.addEventListener('resize', resize);
    const stars = [];
    class FallingStar {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -canvas.height;
        this.size = Math.random() * 3 + 1.5;
        this.speed = Math.random() * 0.7 + 0.2;
        this.opacity = Math.random() * 0.8 + 0.2;
      }
      update() { this.y += this.speed; if (this.y > canvas.height) this.reset(); }
      draw() {
        ctx.save(); ctx.translate(this.x, this.y);
        ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
        ctx.beginPath(); ctx.arc(0, 0, this.size, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    }
    for (let i = 0; i < 30; i++) stars.push(new FallingStar());
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => { s.update(); s.draw(); });
      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
