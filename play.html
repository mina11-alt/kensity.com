<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>كنيسة مارمينا والأنبا توماس والبابا كيرلس السادس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-light: #f8fafc;
      --bg-gradient-light: radial-gradient(circle at 50% 20%, #ffffff 0%, #edf4f8 60%, #e2ebf0 100%);
      --text-light: #1e293b;
      --card-bg-light: rgba(255, 255, 255, 0.85);

      --bg-dark: #0f172a;
      --bg-gradient-dark: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      --text-dark: #f8fafc;
      --card-bg-dark: rgba(30, 41, 59, 0.85);

      --gold-primary: #d4af37;
      --gold-dark: #b8860b;
      --navy-primary: #1a2a40;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Tajawal', sans-serif;
      direction: rtl;
      background: var(--bg-gradient-light);
      background-attachment: fixed;
      color: var(--text-light);
      transition: background 0.5s ease, color 0.5s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body.dark-mode {
      background: var(--bg-gradient-dark);
      background-attachment: fixed;
      color: var(--text-dark);
    }

    .top-navbar {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      height: 65px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 1000;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    body.dark-mode .top-navbar {
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
    }

    .navbar-left { display: flex; align-items: center; gap: 12px; }

    .site-title {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--navy-primary);
      transition: color 0.4s ease;
    }

    body.dark-mode .site-title { color: var(--gold-primary); }

    .navbar-right { display: flex; align-items: center; gap: 12px; }

    .back-btn {
      background: none;
      border: none;
      color: var(--navy-primary);
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.3s, transform 0.2s;
    }

    body.dark-mode .back-btn { color: var(--gold-primary); }

    .back-btn:hover {
      transform: translateX(-3px);
      color: var(--gold-dark);
    }

    .user-badge {
      font-size: 0.9rem;
      font-weight: 700;
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold-dark);
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--gold-primary);
    }
    body.dark-mode .user-badge { color: var(--gold-primary); }

    .main-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 90px 20px 30px;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: var(--card-bg-light);
      border: 1px solid rgba(212, 175, 55, 0.25);
      backdrop-filter: blur(12px);
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
      max-width: 560px;
      width: 100%;
      text-align: center;
      position: relative;
    }

    body.dark-mode .card {
      background: var(--card-bg-dark);
      border-color: rgba(212, 175, 55, 0.15);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
    }

    h1 { margin-bottom: 15px; font-size: 1.6rem; font-weight: 800; color: var(--navy-primary); }
    body.dark-mode h1 { color: var(--gold-primary); }

    .progress-bar-container {
      width: 100%; height: 8px; background: rgba(0,0,0,0.08); border-radius: 10px; margin-bottom: 20px; overflow: hidden;
    }
    body.dark-mode .progress-bar-container { background: rgba(255,255,255,0.1); }
    .progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark)); transition: width 0.3s ease; border-radius: 10px; }

    .question-box {
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 16px;
      padding: 20px;
      font-size: 1.2rem;
      font-weight: 700;
      min-height: 95px;
      display: flex; align-items: center; justify-content: center;
    }
    body.dark-mode .question-box { background: rgba(255, 255, 255, 0.03); border-color: rgba(212, 175, 55, 0.2); }

    .options button {
      display: block; width: 100%; margin: 10px 0; padding: 14px;
      font-size: 1.02rem; font-family: 'Tajawal', sans-serif; font-weight: 700;
      border: 1px solid var(--gold-primary); border-radius: 14px; cursor: pointer;
      background: linear-gradient(135deg, var(--navy-primary) 0%, #2c3e50 100%);
      color: #ffffff; transition: all 0.25s ease;
    }

    .options button:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-dark) 100%);
      transform: translateY(-2px);
    }

    /* لون الإجابة الصحيحة (أزرق) */
    .options button.correct-btn { background: #00b309 !important; border-color: #00b309 !important; }
    /* لون الإجابة الخاطئة (أحمر) */
    .options button.wrong-btn { background: #dc2626c3 !important; border-color: #b91c1c96 !important; }

    #timer { font-weight: 800; font-size: 1.05rem; margin-top: 15px; color: #e11d48; background: rgba(225, 29, 72, 0.1); display: inline-block; padding: 6px 16px; border-radius: 20px; }
    #result { margin-top: 15px; font-size: 1.15rem; font-weight: 800; min-height: 30px; }
    .correct-text { color: #36c203 !important; }
    .wrong-text { color: #dc2626 !important; }

    .action-btn {
      margin: 10px 5px 0; padding: 12px 24px; font-size: 1rem; font-weight: 800;
      font-family: 'Tajawal', sans-serif; background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-dark) 100%);
      color: #fff; border: none; border-radius: 12px; cursor: pointer;
    }

    .leaderboard-card {
      max-width: 350px; width: 100%; text-align: right; display: block;
    }
    .leader-item {
      display: flex; justify-content: space-between; padding: 10px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2); font-weight: 700;
    }
    .leader-rank { font-weight: 800; color: var(--gold-primary); margin-left: 8px; }
    
    /* تحسينات خاصة بالموبايل */
    @media (max-width: 600px) {
      .top-navbar {
        padding: 0 12px;
      }
      .site-title { font-size: 0.95rem; }


      .content {
        padding-top: 85px;
        padding-bottom: 110px;
      }}
      /* الشريط العلوي */
  .top-navbar {

  .navbar-left {

  .navbar-left img {

  }

  body.dark-mode .site-title {
    color: var(--gold-primary);
  }

  .navbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .icon-btn, .back-btn {
    background: none;
    border: none;
    color: var(--navy-primary);
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.3s, transform 0.2s;
  }

  body.dark-mode .icon-btn, 
  body.dark-mode .back-btn {
    color: var(--gold-primary);
  }
  </style>
</head>
<body>
  <div class="top-navbar">
    <div class="navbar-left">
            <img src="صوره الكنيسه.jpeg" alt="شعار الكنيسة" />

      <span class="site-title">كنيسة مارمينا والأنبا توماس والبابا كيرلس السادس</span>
    </div>
    <div class="navbar-right">
      <div id="userBadge" class="user-badge">اللاعب: زائر</div>
      <button class="back-btn" onclick="goBack()" title="رجوع">←</button>
    </div>
  </div>

  <div class="main-container">
    <div class="card">
      <h1>🧠 لعبة مين أنا؟</h1>
      
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div id="question" class="question-box">جارٍ تحميل السؤال...</div>
      <div class="options" id="options"></div>
      <div id="timer">⏱️ الوقت المتبقي: <span id="time">30</span> ثانية</div>
      <div id="result"></div>
      <div id="restartContainer"></div>
    </div>

    <div class="card leaderboard-card" id="leaderboardCard">
      <h2 style="font-size: 1.3rem; margin-bottom: 15px; color: var(--gold-primary);">🏆 لوحة الأبطال العالمية</h2>
      <div id="leaderboardList">جارٍ تحضير ترتيب اللاعبين...</div>
    </div>
  </div>

  <script>
    function applySavedTheme() {
      const savedMode = localStorage.getItem("darkMode");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

      if (savedMode === "on" || (!savedMode && prefersDark)) {
        document.body.classList.add("dark-mode");
      } else {
        document.body.classList.remove("dark-mode");
      }
    }

    window.addEventListener("storage", (e) => {
      if (e.key === "darkMode") {
        applySavedTheme();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      applySavedTheme();
      document.body.classList.add('visible');
    });

    function goBack() {
      if (document.referrer && document.referrer !== "") {
        history.back();
      } else {
        location.href = "index.html";
      }
    }

    const BIN_ID = "6a7b78baf5f4af5e2908c729";
    const MASTER_KEY = "$2a$10$nWS.HLOE22OzpBPoDWRac.wbPEgsvSZaQuZo/hxSNNRrbAB/HsAEu";
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    let currentUser = JSON.parse(localStorage.getItem('currentUser')) || { name: 'زائر', score: 0 };

    const allQuestions = [
      { 
        q: "أساعد الفقراء كثيرًا وأعطي الهدايا سرًا. من أنا؟", 
        options: ["القديس نيقولاوس (سانتا كلوز)", "القديس أثناسيوس الرسولي حامي الإيمان", "القديس أغسطينوس", "القديس بولس الرسول"], 
        correct: "القديس نيقولاوس (سانتا كلوز)"
      },
      { 
        q: "أنا أول من أسس الرهبنة في العالم. من أنا؟", 
        options: ["القديس العظيم الأنبا أنطونيوس", "القديس العظيم الأنبا باخوميوس أب الشركة", "القديس أثناسيوس الرسولي حامي الإيمان", "الأنبا مقار"], 
        correct: "القديس العظيم الأنبا أنطونيوس"
      },
      { 
        q: "أنا كتبت قانون الإيمان في مجمع نيقية. من أنا؟", 
        options: ["القديس أثناسيوس الرسولي حامي الإيمان", "البابا كيرلس عمود الدين", "القديس بولس الرسول", "القديس بطرس الرسول"], 
        correct: "القديس أثناسيوس الرسولي حامي الإيمان" 
      },
      { 
        q: "كنت رئيسًا للعشارين . من أنا؟", 
        options: ["زكا العشار", "القديس بولس الرسول", "القديس متى الرسول"], 
        correct: "زكا العشار" 
      },
      { 
        q: "نجونا من آتون النار . من نحن؟", 
        options: ["الثلاثة فتية القديسين", "ابونا دانيال النبي", "ابونا موسى النبي"], 
        correct: "الثلاثة فتية القديسين" 
      },
      { 
        q: "أنا كاروز الديار المصرية . من أنا؟", 
        options: ["القديس مرقس الرسول", "القديس بولس الرسول", "القديس يوحنا الحبيب", "القديس يعقوب الرسول"], 
        correct: "القديس مرقس الرسول" 
      },
      { 
        q: "أنا النبي الذي ابتلعه الحوت وقضيت في بطنه 3 أيام. من أنا؟", 
        options: ["ابونا يونان النبي", "ابونا إيليا النبي", "ابونا موسى النبي", "ابونا إشعياء النبي"], 
        correct: "ابونا يونان النبي"
      },
      { 
        q: "أنا الملك الحكيم الذي بنيت هيكل الرب في أورشليم. من أنا؟", 
        options: ["ابونا سليمان النبي", "ابونا داود النبي", "الملك هيرودس"], 
        correct: "ابونا سليمان النبي" 
      },
      { 
        q: "أنا الرسول الذي أنكرت يسوع ثلاث مرات. من أنا؟", 
        options: ["القديس بطرس الرسول", "القديس يوحنا الرسول", "القديس يعقوب بن زبدي", "القديس توما الرسول"], 
        correct: "القديس بطرس الرسول" 
      },
      { 
        q: "أنا القديسة أم ربنا يسوع المسيح له كل المجد . من أنا؟", 
        options: ["القديسة العذراء مريم والدة الإله", "القديسة مريم المجدلية", "القديسة مريم أخت لعازر", "القديسة حنة أم العذراء"], 
        correct: "القديسة العذراء مريم والدة الإله" 
      },
      { 
        q: "أنا الرسول الذي شكك في القيامة حتى لمس أثر المسامير. من أنا؟", 
        options: ["القديس توما الرسول", "القديس بطرس الرسول", "القديس يوحنا الإنجيلي", "القديس بولس الرسول"], 
        correct: "القديس توما الرسول" 
      },
      { 
        q: "أنا الرسول الذي كتبت 14 رسالة في العهد الجديد. من أنا؟", 
        options: ["القديس بولس الرسول", "القديس بطرس الرسول", "القديس يوحنا", "القديس يعقوب الرسول"], 
        correct: "القديس بولس الرسول" 
      },
      { 
        q: "أنا أم القديس يوحنا المعمدان وزوجة ابونا زكريا الكاهن. من أنا؟", 
        options: ["القديسة إليصابات أخت العذراء", "القديسة العذراء مريم", "القديسة حنة أم العذراء"], 
        correct: "القديسة إليصابات أخت العذراء" 
      }
    ];

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    let questions = [], currentIndex = 0, score = 0, timeLeft = 30, timer;

    const questionEl = document.getElementById('question');
    const optionsDiv = document.getElementById('options');
    const resultEl = document.getElementById('result');
    const progressBar = document.getElementById('progressBar');
    const restartContainer = document.getElementById('restartContainer');

    function initGame() {
      document.getElementById('userBadge').innerText = `اللاعب: ${currentUser.name}`;
      shuffleArray(allQuestions);
      questions = allQuestions.slice(0, 8);
      currentIndex = 0;
      score = 0;
      restartContainer.innerHTML = '';
      loadQuestion();
      loadLeaderboard();
    }

    function loadQuestion() {
      clearInterval(timer);
      if (currentIndex >= questions.length) {
        showFinalResult();
        return;
      }

      progressBar.style.width = `${(currentIndex / questions.length) * 100}%`;
      const currentQ = questions[currentIndex];
      questionEl.innerText = `(${currentIndex + 1}/${questions.length}) ${currentQ.q}`;

      let options = [...currentQ.options];
      shuffleArray(options);

      optionsDiv.innerHTML = '';
      options.forEach(option => {
        const btn = document.createElement('button');
        btn.innerText = option;
        btn.onclick = () => checkAnswer(option, btn);
        optionsDiv.appendChild(btn);
      });

      timeLeft = 30;
      document.getElementById('time').innerText = timeLeft;
      resultEl.innerText = '';
      document.getElementById('timer').style.display = 'inline-block';

      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('time').innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          score -= 10;
          resultEl.className = 'wrong-text';
          resultEl.innerText = `⏰ انتهى الوقت! (-10 نقاط) الإجابة: ${currentQ.correct.trim()}`;
          highlightCorrect(currentQ.correct);
          disableOptions();
          currentIndex++;
          setTimeout(loadQuestion, 2000);
        }
      }, 1000);
    }

    function checkAnswer(selected, btnElement) {
      clearInterval(timer);
      disableOptions();
      const currentQ = questions[currentIndex];
      
      if (selected.trim() === currentQ.correct.trim()) {
        score += 5;
        btnElement.classList.add('correct-btn');
        resultEl.className = 'correct-text';
        resultEl.innerText = '✅ إجابة صحيحة! (+5 نقاط)';
      } else {
        score -= 10;
        btnElement.classList.add('wrong-btn');
        highlightCorrect(currentQ.correct); // إبراز الإجابة الصحيحة باللون الأزرق
        resultEl.className = 'wrong-text';
        resultEl.innerText = `❌ إجابة خاطئة! (-10 نقاط)`;
      }
      currentIndex++;
      setTimeout(loadQuestion, 2000);
    }

    // مطابقة النص بعد إزالة المسافات الزائدة
    function highlightCorrect(correctText) {
      optionsDiv.querySelectorAll('button').forEach(b => {
        if (b.innerText.trim() === correctText.trim()) {
          b.classList.add('correct-btn');
        }
      });
    }

    function disableOptions() {
      optionsDiv.querySelectorAll('button').forEach(b => b.disabled = true);
    }

    async function showFinalResult() {
      progressBar.style.width = '100%';
      questionEl.innerText = `🎉 انتهت اللعبة!\n نتيجة الجولة الحالية: ${score} نقطة`;
      optionsDiv.innerHTML = '';
      document.getElementById('timer').style.display = 'none';

      if (currentUser.name !== 'زائر') {
        resultEl.innerText = '⏳ جارٍ مزامنة النقاط مع الترتيب العالمي...';
        await updateUserScoreOnCloud(score);
      } else {
        resultEl.innerText = '💡 سجل دخولك ليتم احتساب نقاطك في الترتيب العالمي!';
      }

      restartContainer.innerHTML = '<button class="action-btn" onclick="initGame()">🔄 اللعب مرة أخرى</button>';
    }

    async function updateUserScoreOnCloud(addedScore) {
      try {
        const res = await fetch(API_URL + '/latest', { headers: { 'X-Master-Key': MASTER_KEY.trim() } });
        const data = await res.json();
        let users = Array.isArray(data.record) ? data.record : [];
        
        let userIndex = users.findIndex(u => u.name && u.name.toLowerCase() === currentUser.name.toLowerCase());
        if (userIndex !== -1) {
          let currentTotal = users[userIndex].score || 0;
          let newTotal = Math.max(0, currentTotal + addedScore);
          
          users[userIndex].score = newTotal;
          
          await fetch(API_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY.trim() },
            body: JSON.stringify(users)
          });
          
          resultEl.innerText = `✅ تم تحديث نقاطك! إجمالي نقاطك الآن: ${newTotal} نقطة`;
          loadLeaderboard();
        }
      } catch (err) {
        resultEl.innerText = '❌ تعذر تحديث النقاط بالسيرفر.';
      }
    }

    async function loadLeaderboard() {
      const container = document.getElementById('leaderboardList');
      try {
        const res = await fetch(API_URL + '/latest', { headers: { 'X-Master-Key': MASTER_KEY.trim() } });
        const data = await res.json();
        let users = Array.isArray(data.record) ? data.record : [];
        
        users.sort((a, b) => (b.score || 0) - (a.score || 0));

        container.innerHTML = users.slice(0, 5).map((u, i) => `
          <div class="leader-item">
            <span><span class="leader-rank">#${i + 1}</span> ${u.name}</span>
            <span>🏆 ${u.score || 0} نقطة</span>
          </div>
        `).join('');
      } catch (err) {
        container.innerText = 'تعذر جلب الترتيب العالمي حالياً.';
      }
    }

    window.onload = initGame;
  </script>
</body>
</html>
