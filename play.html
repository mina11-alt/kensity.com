<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
 <title>كنيسة مارمينا والأنبا توماس و البابا كيرلس السادس
 </title>  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient-light: radial-gradient(circle at 50% 20%, #ffffff 0%, #edf4f8 60%, #e2ebf0 100%);
      --text-light: #1e293b;
      --card-bg-light: rgba(255, 255, 255, 0.9);
      
      --bg-gradient-dark: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      --text-dark: #f8fafc;
      --card-bg-dark: rgba(30, 41, 59, 0.9);

      --gold-primary: #d4af37;
      --gold-dark: #b8860b;
      --navy-primary: #1a2a40;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      direction: rtl;
      background: var(--bg-gradient-light);
      background-attachment: fixed;
      color: var(--text-light);
      transition: background 0.5s ease, color 0.5s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body.dark-mode {
      background: var(--bg-gradient-dark);
      background-attachment: fixed;
      color: var(--text-dark);
    }

    /* الشريط العلوي */
    .top-navbar {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      height: 65px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      transition: background 0.4s ease;
    }

    body.dark-mode .top-navbar {
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
    }

    .navbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .navbar-left img {
      height: 42px;
      width: 42px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
    }

    .site-title {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--navy-primary);
    }

    body.dark-mode .site-title {
      color: var(--gold-primary);
    }

    /* Switch الوضع الداكن */
    .theme-switch-wrapper {
      display: flex;
      align-items: center;
    }

    .theme-switch {
      display: inline-block;
      height: 30px;
      position: relative;
      width: 60px;
    }

    .theme-switch input {
      display: none;
    }

    .slider {
      background-color: #cbd5e1;
      bottom: 0;
      cursor: pointer;
      left: 0;
      position: absolute;
      right: 0;
      top: 0;
      transition: 0.4s;
      border-radius: 34px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px;
      border: 1px solid rgba(0,0,0,0.1);
    }

    .slider .icon {
      font-size: 13px;
      user-select: none;
    }

    .slider:before {
      background-color: #fff;
      bottom: 3px;
      content: "";
      height: 22px;
      left: 3px;
      position: absolute;
      transition: 0.4s;
      width: 22px;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    input:checked + .slider {
      background-color: var(--navy-primary);
      border-color: var(--gold-primary);
    }

    input:checked + .slider:before {
      transform: translateX(30px);
      background-color: var(--gold-primary);
    }

    /* حاوية اللعبة الرئيسية */
    .main-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 90px 20px 30px;
    }

    .card {
      background: var(--card-bg-light);
      border: 1px solid rgba(212, 175, 55, 0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
      max-width: 560px;
      width: 100%;
      text-align: center;
      transition: background 0.4s, border-color 0.4s;
      position: relative;
    }

    body.dark-mode .card {
      background: var(--card-bg-dark);
      border-color: rgba(212, 175, 55, 0.15);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-bottom: 15px;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--navy-primary);
    }

    body.dark-mode h1 {
      color: var(--gold-primary);
    }

    /* شريط التقدم */
    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(0,0,0,0.08);
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    body.dark-mode .progress-bar-container {
      background: rgba(255,255,255,0.1);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold-primary), var(--gold-dark));
      transition: width 0.3s ease;
      border-radius: 10px;
    }

    /* صندوق السؤال */
    .question-box {
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 16px;
      padding: 20px;
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.6;
      margin-bottom: 20px;
      min-height: 95px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-light);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
      transition: all 0.3s ease;
    }

    body.dark-mode .question-box {
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-dark);
      border-color: rgba(212, 175, 55, 0.2);
    }

    .fade-in {
      animation: fadeInScale 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes fadeInScale {
      0% {
        opacity: 0;
        transform: scale(0.95) translateY(10px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* الخيارات والأزرار */
    .options button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 14px;
      font-size: 1.02rem;
      font-family: 'Tajawal', sans-serif;
      font-weight: 700;
      border: 1px solid var(--gold-primary);
      border-radius: 14px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--navy-primary) 0%, #2c3e50 100%);
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(26, 42, 64, 0.15);
      transition: all 0.25s ease;
      user-select: none;
    }

    .options button:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-dark) 100%);
      color: #ffffff;
      border-color: transparent;
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(212, 175, 55, 0.3);
    }

    /* درجات ألوان الإجابات الصحيحة والفرعية */
    .options button.correct-btn {
      background: #16a34a !important;
      border-color: #15803d !important;
      color: #ffffff !important;
    }

    .options button.wrong-btn {
      background: #dc2626 !important;
      border-color: #b91c1c !important;
      color: #ffffff !important;
    }

    /* التوقيت والنتيجة */
    #timer {
      font-weight: 800;
      font-size: 1.05rem;
      margin-top: 15px;
      color: #e11d48;
      background: rgba(225, 29, 72, 0.1);
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
    }

    #result {
      margin-top: 15px;
      font-size: 1.15rem;
      font-weight: 800;
      min-height: 30px;
      line-height: 1.5;
    }

    .correct-text {
      color: #16a34a !important;
    }

    .wrong-text {
      color: #dc2626 !important;
    }

    /* زر الإعادة */
    .restart-btn {
      margin-top: 20px;
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: 800;
      font-family: 'Tajawal', sans-serif;
      background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-dark) 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .restart-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 18px rgba(212, 175, 55, 0.4);
    }

    @media (max-width: 600px) {
      .card {
        padding: 20px 15px;
      }
      .question-box {
        font-size: 1.05rem;
        padding: 15px;
      }
      .options button {
        font-size: 0.95rem;
        padding: 12px;
      }
      .site-title {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <!-- الشريط العلوي -->
  <div class="top-navbar">
    <div class="navbar-left">
      <img src="صوره الكنيسه.jpeg" alt="شعار الكنيسة" />
      <span class="site-title">كنيسة مارمينا والأنبا توماس والبابا كيرلس السادس</span>
    </div>
    
    <!-- زر تبديل الوضع الداكن -->
    <div class="theme-switch-wrapper">
      <label class="theme-switch" for="darkModeToggle">
        <input type="checkbox" id="darkModeToggle" />
        
      </label>
    </div>
  </div>

  <!-- المحتوى واللعبة -->
  <div class="main-container">
    <div class="card">
      <h1>🧠 لعبة مين أنا؟</h1>
      
      <!-- شريط التقدم -->
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div id="question" class="question-box">جارٍ تحميل السؤال...</div>
      <div class="options" id="options"></div>
      <div id="timer">⏱️ الوقت المتبقي: <span id="time">30</span> ثانية</div>
      <div id="result"></div>
      <div id="restartContainer"></div>
    </div>
  </div>

  <script>
    // قائمة الأسئلة المحدثة مع إضافة الألقاب الكنسية والأنبيائية
    const allQuestions = [
      { 
        q: "أساعد الفقراء كثيرًا وأعطي الهدايا سرًا. من أنا؟", 
        options: [
          "القديس نيقولاوس  (سانتا كلوز)", 
          "القديس أثناسيوس الرسولي حامي الإيمان", 
          "القديس أغسطينوس ", 
          "القديس بولس الرسول "
        ], 
        correct: "القديس نيقولاوس  (سانتا كلوز)" 
      },
      { 
        q: "أنا أول من أسس الرهبنة في العالم. من أنا؟", 
        options: [
          "القديس العظيم الأنبا أنطونيوس  ", 
          "القديس العظيم الأنبا باخوميوس أب الشركة", 
          "القديس أثناسيوس الرسولي حامي الإيمان", 
          " الأنبا مقار "
        ], 
        correct: "القديس العظيم الأنبا أنطونيوس  " 
      },
      { 
        q: "أنا كتبت قانون الإيمان في مجمع نيقية. من أنا؟", 
        options: [
          "القديس أثناسيوس الرسولي حامي الإيمان", 
          "البابا كيرلس  عمود الدين", 
          "القديس بولس الرسول  ", 
          "القديس بطرس الرسول  "
        ], 
        correct: "القديس أثناسيوس الرسولي حامي الإيمان" 
      },
      { 
        q: "كنت رئيسًا للعشارين . من أنا؟", 
        options: [
          " زكا العشار ", 
          "القديس بولس الرسول", 
          "القديس متى الرسول "
        ], 
        correct: " زكا العشار " 
      },
      { 
        q: "نجونا من آتون النار . من نحن؟", 
        options: [
          " الثلاثة فتية القديسين", 
          "ابونا  دانيال النبي", 
          " ابونا موسى النبي "
        ], 
        correct: " الثلاثة فتية القديسين" 
      },
      { 
        q: "أنا كاروز الديار المصرية . من أنا؟", 
        options: [
          "القديس مرقس الرسول ", 
          "القديس بولس الرسول  ", 
          "القديس يوحنا الحبيب", 
          "القديس يعقوب الرسول  "
        ], 
        correct: "القديس مرقس الرسول " 
      },
      { 
        q: "أنا النبي الذي ابتلعه الحوت وقضيت في بطنه 3 أيام. من أنا؟", 
        options: [
          "  ابونا يونان النبي ", 
          "  ابونا إيليا النبي ", 
          "  ابونا موسى النبي", 
          "  ابونا إشعياء النبي "
        ], 
        correct:"  ابونا يونان النبي "
      },
      { 
        q: "أنا الملك الحكيم الذي بنيت هيكل الرب في أورشليم. من أنا؟", 
        options: [
          "  ابونا سليمان النبي", 
          " ابونا داود النبي ", 
        
          "الملك هيرودس"
        ], 
        correct: "  ابونا سليمان النبي" 
      },
      { 
        q: "أنا الرسول الذي أنكرت يسوع ثلاث مرات. من أنا؟", 
        options: [
          "القديس بطرس الرسول  ", 
          "القديس يوحنا  الرسول", 
          "القديس يعقوب بن زبدي", 
          "القديس توما الرسول"
        ], 
        correct: "القديس بطرس الرسول  " 
      },
      { 
        q: "أنا القديسة  أم ربنا يسوع المسيح له كل المجد . من أنا؟", 
        options: [
          "القديسة العذراء مريم والدة الإله", 
          "القديسة مريم المجدلية", 
          "القديسة مريم أخت لعازر", 
          "القديسة حنة أم العذراء"
        ], 
        correct: "القديسة العذراء مريم والدة الإله" 
      },
     
      { 
        q: "أنا الرسول الذي شكك في القيامة حتى لمس أثر المسامير. من أنا؟", 
        options: [
          "القديس توما الرسول ", 
          "القديس بطرس الرسول", 
          "القديس يوحنا الإنجيلي", 
          "القديس بولس الرسول"
        ], 
        correct: "القديس توما الرسول " 
      },

      { 
        q: "أنا الرسول الذي كتبت 14 رسالة في العهد الجديد. من أنا؟", 
        options: [
          "القديس بولس الرسول  ", 
          "القديس بطرس الرسول", 
          "القديس يوحنا ", 
          "القديس يعقوب الرسول"
        ], 
        correct: "القديس بولس الرسول  " 
      },
      
      { 
        q: "أنا أم القديس يوحنا القديس المعمدان وزوجة ابونا زكريا الكاهن. من أنا؟", 
        options: [
          "القديسة إليصابات أخت العذراء", 
          "القديسة العذراء مريم", 
          "القديسة حنة أم العذراء"
        
        ], 
      
    
  
  
        correct: "القديسة إليصابات أخت العذراء" 
      }
    ];

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }

    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let timeLeft = 30;
    let timer;

    const questionEl = document.getElementById('question');
    const optionsDiv = document.getElementById('options');
    const resultEl = document.getElementById('result');
    const progressBar = document.getElementById('progressBar');
    const restartContainer = document.getElementById('restartContainer');

    function initGame() {
      shuffleArray(allQuestions);
      questions = allQuestions.slice(0, 8); // اختيار 8 أسئلة عشوائية
      currentIndex = 0;
      score = 0;
      restartContainer.innerHTML = '';
      loadQuestion();
    }

    function loadQuestion() {
      clearInterval(timer);
      
      if (currentIndex >= questions.length) {
        showFinalResult();
        return;
      }

      // تحديث شريط التقدم
      const progressPercent = (currentIndex / questions.length) * 100;
      progressBar.style.width = `${progressPercent}%`;
      
      const currentQ = questions[currentIndex];

      questionEl.classList.remove('fade-in');
      void questionEl.offsetWidth; // Trigger reflow
      questionEl.innerText = `(${currentIndex + 1}/${questions.length}) ${currentQ.q}`;
      questionEl.classList.add('fade-in');

      let options = [...currentQ.options];
      shuffleArray(options);

      optionsDiv.innerHTML = '';
      options.forEach(option => {
        const btn = document.createElement('button');
        btn.innerText = option;
        btn.onclick = () => checkAnswer(option, btn);
        optionsDiv.appendChild(btn);
      });

      timeLeft = 30;
      document.getElementById('time').innerText = timeLeft;
      resultEl.innerText = '';
      resultEl.className = '';
      document.getElementById('timer').style.display = 'inline-block';

      timer = setInterval(() => {
        timeLeft--;
        document.getElementById('time').innerText = timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          resultEl.className = 'wrong-text';
          resultEl.innerText = `⏰ انتهى الوقت! الإجابة الصحيحة: ${currentQ.correct}`;
          highlightCorrectAnswer(currentQ.correct);
          disableOptions();
          currentIndex++;
          setTimeout(loadQuestion, 2400);
        }
      }, 1000);
    }

    function checkAnswer(selected, btnElement) {
      clearInterval(timer);
      disableOptions();
      
      const currentQ = questions[currentIndex];
      if (selected === currentQ.correct) {
        score++;
        btnElement.classList.add('correct-btn');
        resultEl.className = 'correct-text';
        resultEl.innerText = '✅ إجابة صحيحة !';
      } else {
        btnElement.classList.add('wrong-btn');
        highlightCorrectAnswer(currentQ.correct);
        resultEl.className = 'wrong-text';
        resultEl.innerText = `❌ إجابة خاطئة. الصحيحة هي:\n${currentQ.correct}`;
      }
      
      currentIndex++;
      setTimeout(loadQuestion, 2400);
    }

    function highlightCorrectAnswer(correctText) {
      const btns = optionsDiv.querySelectorAll('button');
      btns.forEach(b => {
        if (b.innerText === correctText) {
          b.classList.add('correct-btn');
        }
      });
    }

    function disableOptions() {
      const btns = optionsDiv.querySelectorAll('button');
      btns.forEach(b => b.disabled = true);
    }

    function showFinalResult() {
      progressBar.style.width = '100%';
      questionEl.classList.remove('fade-in');
      void questionEl.offsetWidth;
      questionEl.innerText = `🎉 انتهت اللعبة!\n نتيجتك النهائية: ${score} من ${questions.length}`;
      questionEl.classList.add('fade-in');

      optionsDiv.innerHTML = '';
      document.getElementById('timer').style.display = 'none';
      resultEl.innerText = score >= 5 ? '👏 ممتاز جداً! معلوماتك القبطية والكتابية رائعة.' : '👍 محاولة جيدة! تشجع للمزيد من القراءة والتعلم.';
      resultEl.className = 'correct-text';

      // إضافة زر العودة
      restartContainer.innerHTML = '<button class="restart-btn" onclick="initGame()">🔄 اللعب مرة أخرى</button>';
    }

    // إدارة الوضع الداكن
    const root = document.body;
    const darkModeToggle = document.getElementById("darkModeToggle");

    darkModeToggle.addEventListener("change", () => {
      const enabled = darkModeToggle.checked;
      if (enabled) {
        root.classList.add("dark-mode");
        localStorage.setItem("darkMode", "on");
      } else {
        root.classList.remove("dark-mode");
        localStorage.setItem("darkMode", "off");
      }
    });

    window.onload = () => {
      if (localStorage.getItem("darkMode") === "on") {
        root.classList.add("dark-mode");
        darkModeToggle.checked = true;
      }
      initGame();
    };
  </script>
</body>
</html>
