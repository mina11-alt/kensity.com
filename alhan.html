<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>كنيسة مارمينا والأنبا توماس والبابا كيرلس السادس</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      /* متغيرات الوضع الفاتح */
      --bg-gradient-light: linear-gradient(135deg, #f8fafc 0%, #e2ebf0 100%);
      --text-light: #1e293b;
      --card-bg-light: rgba(255, 255, 255, 0.75);
      --card-border-light: rgba(212, 175, 55, 0.3);

      /* متغيرات الوضع الداكن */
      --bg-gradient-dark: linear-gradient(135deg, #0f172a 0%, #020617 100%);
      --text-dark: #f8fafc;
      --card-bg-dark: rgba(30, 41, 59, 0.7);
      --card-border-dark: rgba(212, 175, 55, 0.2);

      /* الهوية البصرية */
      --gold-primary: #d4af37;
      --gold-light: #f3e5ab;
      --gold-dark: #b8860b;
      --navy-primary: #1a2a40;
      --navy-light: #2c3e50;
      --accent-glow: rgba(212, 175, 55, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      direction: rtl;
      background: var(--bg-gradient-light);
      background-attachment: fixed;
      color: var(--text-light);
      transition: background 0.5s ease, color 0.5s ease, opacity 0.6s ease;
      opacity: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    body.visible {
      opacity: 1;
    }

    body.dark-mode {
      background: var(--bg-gradient-dark);
      background-attachment: fixed;
      color: var(--text-dark);
    }

    /* خلفية الصلبان المتحركة */
    .crosses-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-cross {
      position: absolute;
      bottom: -100px;
      color: var(--gold-primary);
      opacity: 0.12;
      user-select: none;
      animation: floatUp 14s linear infinite;
      filter: drop-shadow(0 0 5px var(--gold-primary));
    }

    body.dark-mode .floating-cross {
      opacity: 0.2;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      15% {
        opacity: var(--cross-opacity, 0.2);
      }
      85% {
        opacity: var(--cross-opacity, 0.2);
      }
      100% {
        transform: translateY(-115vh) rotate(360deg) scale(1.1);
        opacity: 0;
      }
    }

    /* الشريط العلوي */
    .top-navbar {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border-light);
      height: 70px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      transition: all 0.4s ease;
    }

    body.dark-mode .top-navbar {
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid var(--card-border-dark);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .navbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .navbar-left img {
      height: 46px;
      width: 46px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
      transition: transform 0.3s ease;
    }

    .navbar-left img:hover {
      transform: rotate(5deg) scale(1.05);
    }

    .site-title {
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--navy-primary);
      letter-spacing: -0.2px;
      transition: color 0.4s ease;
    }

    body.dark-mode .site-title {
      color: var(--gold-primary);
    }

    /* المحتوى الرئيسي */
    .content {
      padding: 120px 20px 40px;
      max-width: 900px;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .page-header {
      text-align: center;
      margin-bottom: 40px;
      animation: fadeInDown 0.8s ease;
    }

    .page-header h1 {
      font-size: 2rem;
      font-weight: 900;
      color: var(--navy-primary);
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--navy-primary), var(--gold-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    body.dark-mode .page-header h1 {
      background: linear-gradient(135deg, #ffffff, var(--gold-primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .page-header p {
      color: #64748b;
      font-size: 1.1rem;
      font-weight: 500;
      transition: color 0.4s ease;
    }

    body.dark-mode .page-header p {
      color: #94a3b8;
    }

    /* شبكة الأزرار */
    .navigation-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      width: 100%;
    }

    /* تصميم الكارت الفاخر */
    .nav-card {
      background: var(--card-bg-light);
      border: 1px solid var(--card-border-light);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 35px 25px;
      border-radius: 24px;
      text-align: center;
      text-decoration: none;
      color: var(--text-light);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    body.dark-mode .nav-card {
      background: var(--card-bg-dark);
      border-color: var(--card-border-dark);
      color: var(--text-dark);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    /* شريط علوي جمالي داخل الكارت */
    .nav-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
      opacity: 0.8;
      transition: opacity 0.3s, height 0.3s;
    }

    /* شارة علوية توضيحية */
    .card-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold-dark);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    body.dark-mode .card-badge {
      color: var(--gold-primary);
    }

    .nav-card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: var(--gold-primary);
      box-shadow: 0 20px 40px var(--accent-glow);
    }

    .nav-card:hover::before {
      height: 6px;
    }

    /* الحاوية الدائرية للأيقونة */
    .icon-wrapper {
      width: 75px;
      height: 75px;
      background: linear-gradient(135deg, rgba(212, 175, 55, 0.15), rgba(212, 175, 55, 0.05));
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      transition: all 0.4s ease;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
    }

    .nav-card:hover .icon-wrapper {
      background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
      transform: scale(1.1) rotate(5deg);
      box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
    }

    .nav-card .icon {
      font-size: 2.2rem;
      transition: transform 0.3s ease;
    }

    .nav-card:hover .icon {
      filter: brightness(1.2);
    }

    .nav-card h2 {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--navy-primary);
      margin-bottom: 10px;
      transition: color 0.4s ease;
    }

    body.dark-mode .nav-card h2 {
      color: #ffffff;
    }

    .nav-card p {
      font-size: 0.95rem;
      color: #64748b;
      line-height: 1.6;
      transition: color 0.4s ease;
      margin-bottom: 15px;
    }

    body.dark-mode .nav-card p {
      color: #94a3b8;
    }

    /* سهم التنقل التفاعلي أسفل الكارت */
    .card-action {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--gold-dark);
      transition: all 0.3s ease;
    }

    body.dark-mode .card-action {
      color: var(--gold-primary);
    }

    .nav-card:hover .card-action {
      gap: 10px;
      letter-spacing: 0.3px;
    }

    .card-action span {
      transition: transform 0.3s ease;
    }

    .nav-card:hover .card-action span {
      transform: translateX(-5px);
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* تجاوب مع الشاشات الصغيرة */
    @media (max-width: 600px) {
      .top-navbar {
        padding: 0 15px;
      }
      .site-title {
        font-size: 0.95rem;
      }
      .page-header h1 {
        font-size: 1.6rem;
      }
      .content {
        padding-top: 100px;
      }
    }
        .back-btn {
      background: rgba(212, 175, 55, 0.1);
      border: 1px solid var(--gold-primary);
      color: var(--navy-primary);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      transition: all 0.3s ease;
    }

    body.dark-mode .back-btn {
      color: var(--gold-primary);
    }

    .back-btn:hover {
      background: var(--gold-primary);
      color: #fff;
      transform: translateX(-3px);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

  </style>
</head>
<body>

  <!-- الشريط العلوي -->
  <header class="top-navbar">
    <div class="navbar-left">
      <img src="صوره الكنيسه.jpeg" alt="شعار الكنيسة" />
      <span class="site-title">كنيسة مارمينا والأنبا توماس والبابا كيرلس السادس</span>
    </div>
     <div class="navbar-right">
      <button class="back-btn" onclick="history.back()" title="رجوع">←</button>
    </div>
  </header>

  <!-- خلفية الصلبان المتحركة -->
  <div class="crosses-container" id="crossesContainer"></div>

  <!-- المحتوى الرئيسي -->
  <main class="content">
    
    <div class="page-header">
      <h1>مرحبًا بكم في  صفحه المردات و الالحان</h1>
      <p>اختر القسم الذي ترغب في استعراضه</p>
    </div>

    <!-- شبكة التنقل بين الصفحات -->
    <div class="navigation-grid">
      
      <!-- القسم الأول: مردات القداس -->
      <a href="responses.html" class="nav-card">
        <span class="card-badge">الطقس والمردات</span>
        <div class="icon-wrapper">
          <span class="icon">🎶</span>
        </div>
        <h2>مردات القداس</h2>
        <p>استمع واقرأ المردات  الخاصة بالقداس .</p>
        <div class="card-action">
          تصفح الآن <span>←</span>
        </div>
      </a>

    </div>
  </main>

  <script>
    const root = document.body;

    // قراءة وتطبيق وضع الألوان المحفوظ في LocalStorage تلقائياً
    function applySavedTheme() {
      const savedMode = localStorage.getItem("darkMode");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

      if (savedMode === "on" || (!savedMode && prefersDark)) {
        root.classList.add("dark-mode");
      } else {
        root.classList.remove("dark-mode");
      }
    }

    // مزامنة حالة الوضع مباشرة إذا تغيرت من نافذة/صفحة أخرى
    window.addEventListener("storage", (e) => {
      if (e.key === "darkMode") {
        applySavedTheme();
      }
    });

    // إنشاء الصلبان المتحركة
    function createFloatingCrosses() {
      const container = document.getElementById("crossesContainer");
      if (!container) return;
      const crossCount = 14;

      for (let i = 0; i < crossCount; i++) {
        const cross = document.createElement("div");
        cross.className = "floating-cross";
        cross.innerText = "☦";
        
        const size = Math.random() * 24 + 18;
        const left = Math.random() * 100;
        const duration = Math.random() * 10 + 12;
        const delay = Math.random() * 8;
        const opacity = Math.random() * 0.15 + 0.1;

        cross.style.fontSize = `${size}px`;
        cross.style.left = `${left}%`;
        cross.style.animationDuration = `${duration}s`;
        cross.style.animationDelay = `${delay}s`;
        cross.style.setProperty('--cross-opacity', opacity);

        container.appendChild(cross);
      }
    }

    // عند تحميل الصفحة
    document.addEventListener("DOMContentLoaded", () => {
      applySavedTheme();
      root.classList.add("visible");
      createFloatingCrosses();

      if (!sessionStorage.getItem("welcomeShown")) {
        // تم إزالة التنبيه المزعج alert واستبداله بتجربة سلسة
        sessionStorage.setItem("welcomeShown", "yes");
      }
    });
  </script>
</body>
</html>
