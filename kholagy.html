<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الخولاجي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      /* التدرج المضيء (Light Mode) */
      --bg-light: #f8fafc;
      --bg-gradient-light: radial-gradient(circle at 50% 20%, #ffffff 0%, #edf4f8 60%, #e2ebf0 100%);
      --text-light: #1e293b;
      --card-bg-light: rgba(255, 255, 255, 0.85);

      /* التدرج الداكن (Dark Mode) */
      --bg-dark: #0f172a;
      --bg-gradient-dark: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      --text-dark: #f8fafc;
      --card-bg-dark: rgba(30, 41, 59, 0.85);

      --gold-primary: #d4af37;
      --gold-dark: #b8860b;
      --navy-primary: #1a2a40;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      direction: rtl;
      background: var(--bg-gradient-light);
      background-attachment: fixed;
      color: var(--text-light);
      transition: background 0.5s ease, color 0.5s ease, opacity 0.6s ease;
      opacity: 0;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body.visible {
      opacity: 1;
    }

    /* أنماط الوضع الداكن */
    body.dark-mode {
      background: var(--bg-gradient-dark);
      background-attachment: fixed;
      color: var(--text-dark);
    }

    /* خلفية الصلبان المتحركة */
    #stars-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .cross {
      position: absolute;
      color: var(--gold-primary);
      opacity: 0.25;
      font-size: var(--size, 16px);
      user-select: none;
      animation: fall var(--duration, 10s) linear infinite;
      animation-delay: var(--delay, 0s);
    }

    body.dark-mode .cross {
      opacity: 0.35;
    }

    @keyframes fall {
      0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* الشريط العلوي */
    .top-navbar {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
      height: 65px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    body.dark-mode .top-navbar {
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid rgba(212, 175, 55, 0.15);
    }

    .navbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .navbar-left img {
      height: 42px;
      width: 42px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
    }

    .site-title {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--navy-primary);
      transition: color 0.4s ease;
    }

    body.dark-mode .site-title {
      color: var(--gold-primary);
    }

    .navbar-right {
      display: flex;
      align-items: center;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--navy-primary);
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.3s, transform 0.2s;
    }

    body.dark-mode .back-btn {
      color: var(--gold-primary);
    }

    .back-btn:hover {
      transform: translateX(-3px);
      color: var(--gold-dark);
    }

    /* المحتوى الرئيسي */
    .content {
      padding: 95px 15px 100px;
      max-width: 1000px;
      margin: auto;
      position: relative;
      z-index: 1;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--navy-primary);
      transition: color 0.4s ease;
    }

    body.dark-mode h2 {
      color: var(--gold-primary);
    }

    .buttons-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 22px;
    }

    .button-card {
      flex: 1 1 220px;
      max-width: 260px;
      background: var(--card-bg-light);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 20px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      backdrop-filter: blur(8px);
      transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.4s ease, border-color 0.4s ease;
      display: flex;
      flex-direction: column;
    }

    body.dark-mode .button-card {
      background: var(--card-bg-dark);
      border-color: rgba(212, 175, 55, 0.15);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .button-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(212, 175, 55, 0.2);
    }

    .button-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      object-position: center;
      border-radius: 14px;
      margin-bottom: 15px;
      image-rendering: -webkit-optimize-contrast;
    }

    .button-card button {
      margin-top: auto;
      background: linear-gradient(135deg, var(--navy-primary) 0%, #2c3e50 100%);
      color: var(--gold-primary);
      border: 1px solid var(--gold-primary);
      border-radius: 12px;
      padding: 12px;
      width: 100%;
      font-size: 1rem;
      font-family: 'Tajawal', sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(26, 42, 64, 0.2);
    }

    .button-card button:hover {
      background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-dark) 100%);
      color: #ffffff;
      border-color: transparent;
      transform: scale(1.02);
    }

    /* الزر العائم في أسفل اليمين */
    .floating-btn {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background: linear-gradient(135deg, var(--navy-primary) 0%, #2c3e50 100%);
      color: var(--gold-primary);
      border: 1.5px solid var(--gold-primary);
      border-radius: 50px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
      z-index: 999;
      transition: all 0.3s ease;
    }

    .floating-btn:hover {
      background: linear-gradient(135deg, var(--gold-primary) 0%, var(--gold-dark) 100%);
      color: #ffffff;
      border-color: transparent;
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 30px rgba(212, 175, 55, 0.4);
    }

    .floating-btn .plus-icon {
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1;
    }

    /* تحسينات خاصة بالموبايل */
    @media (max-width: 600px) {
      .top-navbar {
        padding: 0 12px;
      }
      .site-title { font-size: 0.95rem; }


      .content {
        padding-top: 85px;
        padding-bottom: 110px;
      }

      .button-card {
        max-width: 100%;
      }

      .button-card img {
        height: 140px;
        object-fit: contain;
        background-color: rgba(0, 0, 0, 0.02);
      }

      .floating-btn {
        bottom: 20px;
        right: 15px;
        padding: 10px 16px;
        font-size: 0.85rem;
      }
    }
    
    /* خلفية الصلبان المتحركة */
    .crosses-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .floating-cross {
      position: absolute;
      bottom: -100px;
      color: var(--gold-primary);
      opacity: 0.15;
      user-select: none;
      animation: floatUp 15s linear infinite;
    }

    body.dark-mode .floating-cross {
      opacity: 0.25;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: var(--cross-opacity, 0.2);
      }
      90% {
        opacity: var(--cross-opacity, 0.2);
      }
      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

  </style>
</head>
<body>

  <!-- حاوية أشكال الصلبان المتحركة -->
  <div id="stars-container"></div>

  <!-- الشريط العلوي -->
  <div class="top-navbar">
    <div class="navbar-left">
      <img src="صوره الكنيسه.jpeg" alt="شعار الكنيسة" />
      <span class="site-title">كنيسة مارمينا والأنبا توماس والبابا كيرلس السادس</span>
    </div>

    <div class="navbar-right">
      <!-- زر الرجوع -->
      <button class="back-btn" onclick="goBack()" title="رجوع">←</button>
    </div>
  </div>

  <!-- المحتوى الرئيسي -->
  <div class="content">
    <h2>الخولاجي</h2>
    <div class="buttons-list">
      <div class="button-card">
        <img src="baker and ashia.jpg" alt="رفع بخور عشية و باكر">
        <button onclick="location.href='baker.html'">رفع بخور عشية و باكر</button>
      </div>
      <div class="button-card">
        <img src="pngtree-eucharist-elements-chalice-and-host-png-image_19461150.webp" alt="الحمل">
        <button onclick="location.href='elhamal.html'">الحمل</button>
      </div>
      <div class="button-card">
        <img src="Basilios.jpg" alt="القداس الباسيلي">
        <button onclick="location.href='basily.html'">القداس الباسيلي</button>
      </div>
      <div class="button-card">
        <img src="ghorygorus.webp" alt="القداس الغوريغوري">
        <button onclick="location.href='geory.html'">القداس الغوريغوري</button>
      </div>
    </div>
  </div>

  <!-- الزر العائم -->
  <button class="floating-btn" onclick="location.href='tawzea.html'">
    <span class="plus-icon">+</span>
    <span>التوزيع +  القسمة +  التناول</span>
  </button>

  <script>
    // جلب وتطبيق حالة الوضع الداكن المخزنة
    function applySavedTheme() {
      const savedMode = localStorage.getItem("darkMode");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

      if (savedMode === "on" || (!savedMode && prefersDark)) {
        document.body.classList.add("dark-mode");
      } else {
        document.body.classList.remove("dark-mode");
      }
    }

    // التنقل الآمن للرجوع
    function goBack() {
      if (document.referrer && document.referrer !== "") {
        history.back();
      } else {
        location.href = "index.html";
      }
    }

    // توليد خلفية الصلبان المضيئة المتحركة
    function createCrosses() {
      const container = document.getElementById('stars-container');
      if (!container) return;

      const count = 20;

      for (let i = 0; i < count; i++) {
        const cross = document.createElement('div');
        cross.classList.add('cross');
        cross.innerText = '✟';

        const size = Math.random() * 14 + 12;
        const posX = Math.random() * 100;
        const duration = Math.random() * 10 + 8;
        const delay = Math.random() * 5;

        cross.style.setProperty('--size', `${size}px`);
        cross.style.setProperty('--duration', `${duration}s`);
        cross.style.setProperty('--delay', `${delay}s`);
        cross.style.left = `${posX}%`;

        container.appendChild(cross);
      }
    }

    // الاستماع للتغيرات الحاصلة في local storage من صفحات أخرى
    window.addEventListener("storage", (e) => {
      if (e.key === "darkMode") {
        applySavedTheme();
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      applySavedTheme();
      document.body.classList.add('visible');
      createCrosses();
    });
  </script>
</body>
</html>
